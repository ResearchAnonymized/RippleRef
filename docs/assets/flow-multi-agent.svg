<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-label="Multi-agent MA flow">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B1F2A"/>
    </marker>
  </defs>
  <rect width="1100" height="260" rx="12" fill="#F7F4EC"/>
  <text x="28" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B1F2A">Multi-agent (P-MA · LangGraph)</text>
  <text x="28" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">Specialized agents collaborate · may revise · then the same shared verifier</text>

  <!-- start -->
  <rect x="28" y="90" width="130" height="78" rx="8" fill="#0B1F2A"/>
  <text x="44" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#F0B429" font-weight="700">Context</text>
  <text x="44" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#CBD5E1">file · deps</text>

  <line x1="168" y1="129" x2="198" y2="129" stroke="#0B1F2A" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- plan -->
  <rect x="206" y="90" width="130" height="78" rx="8" fill="#123A3A"/>
  <text x="222" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5EEAD4" font-weight="700">Planner</text>
  <text x="222" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#CBD5E1">strategy</text>

  <line x1="346" y1="129" x2="376" y2="129" stroke="#0B1F2A" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- edit -->
  <rect x="384" y="90" width="130" height="78" rx="8" fill="#1A4D3A"/>
  <text x="400" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#F0B429" font-weight="700">Editor</text>
  <text x="400" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#CBD5E1">rewrite Java</text>

  <line x1="524" y1="129" x2="554" y2="129" stroke="#0B1F2A" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- agent verify -->
  <rect x="562" y="90" width="140" height="78" rx="8" fill="#123A3A"/>
  <text x="578" y="118" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5EEAD4" font-weight="700">Agent verify</text>
  <text x="578" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#CBD5E1">static / LLM</text>

  <!-- feedback loop arrow back to editor -->
  <path d="M632 178 L632 198 L450 198 L450 172" fill="none" stroke="#F0B429" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="470" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">revise if needed</text>

  <line x1="712" y1="129" x2="742" y2="129" stroke="#0B1F2A" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- shared verify -->
  <rect x="750" y="90" width="322" height="78" rx="8" fill="#F0B429"/>
  <text x="766" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#0B1F2A" font-weight="700">Shared L1L5 verify (same as B0)</text>
  <text x="766" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3F3F46">apply-and-verify · reports</text>

  <text x="28" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">Code: agents/ma_ref_study.py · agents/refactor_graph.py · agents/refactor_nodes/</text>
</svg>
