<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="RippleRef architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#E8F2EE"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B1F2A"/>
    </marker>
  </defs>
  <rect width="1100" height="280" rx="12" fill="url(#bg)"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1F2A">RippleRef - one horizontal path</text>
  <text x="28" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">You operate the left - agents generate in the middle - one verifier scores the right</text>

  <rect x="28" y="88" width="180" height="140" rx="10" fill="#0B1F2A"/>
  <text x="48" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F0B429">1 - Control</text>
  <text x="48" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC">Web UI</text>
  <text x="48" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC">Batch scripts</text>
  <text x="48" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8">Next.js / shell</text>

  <line x1="218" y1="158" x2="252" y2="158" stroke="#0B1F2A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="260" y="88" width="200" height="140" rx="10" fill="#123A3A"/>
  <text x="280" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5EEAD4">2 - Generate</text>
  <text x="280" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC">Single-prompt V2</text>
  <text x="280" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC">or LangGraph MA</text>
  <text x="280" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8">Python agents / LLMs</text>

  <line x1="470" y1="158" x2="504" y2="158" stroke="#0B1F2A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="512" y="88" width="200" height="140" rx="10" fill="#1A4D3A"/>
  <text x="532" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F0B429">3 - Verify (shared)</text>
  <text x="532" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC">L1 to L5 ripple checks</text>
  <text x="532" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC">Spring Boot API</text>
  <text x="532" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8">port 8083</text>

  <line x1="722" y1="158" x2="756" y2="158" stroke="#0B1F2A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="764" y="88" width="308" height="140" rx="10" fill="#F0B429"/>
  <text x="784" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1F2A">4 - Evidence</text>
  <text x="784" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1F2A">pair_key artifacts</text>
  <text x="784" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1F2A">risk / adoption / reports</text>
  <text x="784" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3F3F46">prompts / candidates / profiles</text>
</svg>
